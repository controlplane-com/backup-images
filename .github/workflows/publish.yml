name: Publish Image

on:
  workflow_dispatch:
    inputs:
      image:
        description: "Image to build (e.g. cockroach-backup)"
        required: true
        type: string
      tag:
        description: "Image tag (e.g. 1.0.0)"
        required: true
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ inputs.image }}
          push: true
          tags: ghcr.io/controlplane-com/backup-images/${{ inputs.image }}:${{ inputs.tag }}
          platforms: linux/amd64,linux/arm64
